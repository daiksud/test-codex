name: Verify

on: push

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Codex verification
    # Hosted CI runs source checks only; Codex runs on the Mac self-hosted runner.
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: node --check .github/scripts/codex-issue.mjs
      - run: node --test tests/*.test.mjs
