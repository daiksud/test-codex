name: Codex issue flow

on:
  issues:
    types: [opened]

defaults:
  run:
    shell: bash

jobs:
  codex:
    if: ${{ github.event.issue.user.login == 'daiksud' }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 1439
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    concurrency:
      group: codex-issue-${{ github.repository_id }}
      queue: max
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          clean: true
          persist-credentials: true
      - name: Start Codex Plan
        run: node .github/scripts/codex-issue.mjs
        env:
          GH_TOKEN: ${{ github.token }}
